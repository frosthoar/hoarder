# pyproject.toml
[project]
name = "hoarder"
version = "0.1.0"
description = "Library for handling hash-based archives and file collections"
requires-python = ">=3.13"
dependencies = [
    "rarfile",
]

[project.optional-dependencies]
test = [
    "pytest",
    "typeguard",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hoarder"]

[tool.pytest.ini_options]
typeguard-packages = "hoarder"
# optional extras:
typeguard-collection-check-strategy = "ALL_ITEMS"
typeguard-debug-instrumentation    = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 0  # Single line output to match GitHub super-linter
force_single_line = false
