# pyproject.toml
[project]
name = "hoarder"
version = "0.1.0"
description = "Library for handling hash-based archives and file collections"
requires-python = ">=3.13"
dependencies = [
    "rarfile",
]

[project.optional-dependencies]
test = [
    "pytest",
    "typeguard",
]
lint = [
    # Pinned to match the Black version bundled by the super-linter image
    # this repo's CI runs (see .github/workflows/super-linter.yml), whose
    # 2023-01 build predates Black 24.1.0's "compact dummy implementations"
    # stable-style change - confirmed empirically by reproducing CI's exact
    # reformat diff for contents_hasher.py's `...`-only method bodies. A
    # newer Black disagrees with this on how to format those (and possibly
    # other) constructs, which shows up as spurious CI-only reformat diffs.
    "black==23.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hoarder"]

[tool.pytest.ini_options]
typeguard-packages = "hoarder"
# optional extras:
typeguard-collection-check-strategy = "ALL_ITEMS"
typeguard-debug-instrumentation    = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 0  # Single line output to match GitHub super-linter
force_single_line = false

[[tool.mypy.overrides]]
module = "rarfile"
ignore_missing_imports = true
